workflows: 
  android-release: 
    name: Android Release 
    instance_type: mac_mini_m1 
    max_build_duration: 60 
    environment: 
      java: 17 
      flutter: stable 
    scripts: 
      - flutter packages pub get 
      - flutter build appbundle --release 
    artifacts: 
      - build/app/outputs/** 
