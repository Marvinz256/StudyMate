name: studymate
description: StudyMate is a premium AI-powered healthcare study companion for health science students.
publish_to: none
version: 0.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_riverpod: ^2.3.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  google_sign_in: ^7.2.0
  flutter_signin_button: ^2.1.1
  intl: ^0.20.3
  animations: ^2.0.5
  flutter_svg: ^2.0.0
  shared_preferences: ^2.1.1
  google_generative_ai: ^0.4.0
  camera: ^0.12.0
  image_picker: ^1.2.3
  record: ^7.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15
  permission_handler: 11.3.1
  uuid: ^4.0.0
  font_awesome_flutter: ^11.0.0

dependency_overrides:
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
